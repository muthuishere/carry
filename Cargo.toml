[package]
name = "carry"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Your container's tools and config, from any S3 bucket"
repository = "https://github.com/muthuishere/carry"

[dependencies]
anyhow = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "process", "signal", "time", "sync"] }
object_store = { version = "0.11", default-features = false, features = ["aws"] }
bytes = "1"
futures = "0.3"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
blake3 = "1"
zstd = "0.13"
chacha20poly1305 = { version = "0.10", features = ["stream"] }
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8", "pem"] }
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
nix = { version = "0.29", features = ["signal", "process", "fs", "resource"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"
