[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "carry-sdk"
version = "0.1.1"
description = "Python SDK for carry: your container's tools and config, from any S3 bucket (thin wrapper over the carry CLI)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [{ name = "Muthukumaran Navaneethakrishnan" }]
keywords = ["carry", "s3", "containers", "config", "kubernetes", "sdk"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/muthuishere/carry"
Source = "https://github.com/muthuishere/carry/tree/main/sdk/python"
Issues = "https://github.com/muthuishere/carry/issues"

[tool.setuptools]
packages = ["carry_sdk"]
