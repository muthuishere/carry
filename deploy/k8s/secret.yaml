# Placeholders only. Create the real one with:
#   kubectl create secret generic carry-web \
#     --from-literal=AWS_ACCESS_KEY_ID=... --from-literal=AWS_SECRET_ACCESS_KEY=... \
#     --from-literal=CARRY_KEY="$(openssl rand -base64 32)"
apiVersion: v1
kind: Secret
metadata:
  name: carry-web
type: Opaque
stringData:
  CARRY_REPO: s3://YOUR_BUCKET/YOUR_PREFIX
  CARRY_S3_REGION: us-east-1
  # CARRY_S3_ENDPOINT: https://YOUR_S3_COMPATIBLE_ENDPOINT   # omit for AWS S3
  AWS_ACCESS_KEY_ID: YOUR_KEY_HERE
  AWS_SECRET_ACCESS_KEY: YOUR_KEY_HERE
  CARRY_KEY: YOUR_KEY_HERE            # base64 of 32 random bytes
  CARRY_TOOL_PUBKEY: YOUR_KEY_HERE    # public key from `carry tool keygen`
