# Placeholders only. Create the real ones with:
#   kubectl create secret generic carry-web-key --from-literal=key="$(openssl rand -base64 32)"
#   kubectl create secret generic carry-web-s3 \
#     --from-literal=AWS_ACCESS_KEY_ID=... --from-literal=AWS_SECRET_ACCESS_KEY=...
# The master key is MOUNTED as a file (CARRY_KEY_FILE), never passed as an env var.
apiVersion: v1
kind: Secret
metadata:
  name: carry-web-key
type: Opaque
stringData:
  key: YOUR_KEY_HERE                  # base64 of 32 random bytes
---
apiVersion: v1
kind: Secret
metadata:
  name: carry-web-s3
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: YOUR_KEY_HERE
  AWS_SECRET_ACCESS_KEY: YOUR_KEY_HERE
