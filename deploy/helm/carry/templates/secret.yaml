{{- if not .Values.carry.key.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "carry.keySecret" . }}
  labels: {{- include "carry.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.carry.key.secretKey }}: {{ required "set carry.key.existingSecret or carry.key.value" .Values.carry.key.value | quote }}
{{- end }}
{{- if not .Values.carry.s3Credentials.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "carry.s3Secret" . }}
  labels: {{- include "carry.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.carry.s3Credentials.accessKeyIdKey }}: {{ required "set carry.s3Credentials.existingSecret or accessKeyId" .Values.carry.s3Credentials.accessKeyId | quote }}
  {{ .Values.carry.s3Credentials.secretAccessKeyKey }}: {{ required "set carry.s3Credentials.existingSecret or secretAccessKey" .Values.carry.s3Credentials.secretAccessKey | quote }}
{{- end }}
