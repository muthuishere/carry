apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "carry.fullname" . }}
  labels: {{- include "carry.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{- include "carry.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "carry.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{- end }}
      annotations:
        {{- if not .Values.carry.key.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}{{ toYaml . | nindent 8 }}{{- end }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $init := include "carry.initContainers" . | trim }}
      {{- if $init }}
      initContainers:
        {{- $init | nindent 8 }}
      {{- end }}
      containers:
        - name: app
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag }}"
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          # carry restores state (fail-open, restoreBudgetMs), then runs the app as its child.
          command:
            {{- include "carry.command" . | nindent 12 }}
            {{- range (required "app.command is required" .Values.app.command) }}
            - {{ . | quote }}
            {{- end }}
          env:
            {{- include "carry.env" . | nindent 12 }}
            {{- with .Values.app.env }}{{ toYaml . | nindent 12 }}{{- end }}
          {{- with .Values.app.ports }}
          ports: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.app.readinessProbe }}
          readinessProbe: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.app.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.app.securityContext }}
          securityContext: {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- include "carry.volumeMounts" . | nindent 12 }}
            {{- with .Values.app.volumeMounts }}{{ toYaml . | nindent 12 }}{{- end }}
      volumes:
        {{- include "carry.volumes" . | nindent 8 }}
        {{- with .Values.app.volumes }}{{ toYaml . | nindent 8 }}{{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
