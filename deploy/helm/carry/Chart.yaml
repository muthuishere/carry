  artifacthub.io/operator: "false"
  artifacthub.io/images: |
    - name: carry
      image: docker.io/muthuishere/carry:0.1.1
  artifacthub.io/links: |
    - name: source
      url: https://github.com/muthuishere/carry
    - name: CLI contract
      url: https://github.com/muthuishere/carry/blob/main/docs/cli-contract.md
