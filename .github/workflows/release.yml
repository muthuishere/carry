name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - id: tags
        run: |
          {
            echo "list<<EOF"
            echo "ghcr.io/muthuishere/carry:${{ steps.ver.outputs.version }}"
            echo "ghcr.io/muthuishere/carry:latest"
            if [ "$HAS_DOCKERHUB" = "true" ]; then
              echo "docker.io/muthuishere/carry:${{ steps.ver.outputs.version }}"
              echo "docker.io/muthuishere/carry:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=https://github.com/muthuishere/carry
            org.opencontainers.image.description=Your container's tools and config, from any S3 bucket
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Same Dockerfile, exporting only the scratch stage's filesystem.
      - name: Build static binaries
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            docker buildx build --platform "linux/${arch}" --output "type=local,dest=out/${arch}" .
            cp "out/${arch}/carry" "carry-linux-${arch}"
          done
          sha256sum carry-linux-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            carry-linux-amd64
            carry-linux-arm64
            SHA256SUMS
          generate_release_notes: true
