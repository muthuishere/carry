name: publish-sdks

# Publishes the CLI crate and every SDK on a v* tag. Each registry job runs only when its
# credential is configured, and skips cleanly when that version is already published.
#   crates.io  -> secret CARGO_REGISTRY_TOKEN
#   npm        -> secret NPM_TOKEN
#   PyPI       -> trusted publishing (OIDC); enable with repo variable PYPI_TRUSTED=true
#   NuGet      -> secret NUGET_API_KEY
#   Maven      -> secrets CENTRAL_USERNAME, CENTRAL_PASSWORD, GPG_PRIVATE_KEY (+ optional GPG_PASSPHRASE)
#   Go         -> pushes tag sdk/go/vX.Y.Z and asks proxy.golang.org to fetch it (no secret)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crates:
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - if: env.CARGO_REGISTRY_TOKEN != ''
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if curl -sf -A publish-sdks "https://crates.io/api/v1/crates/carry/$v" >/dev/null; then
            echo "carry $v already on crates.io"; exit 0; fi
          cargo publish --locked

  npm:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    defaults: { run: { working-directory: sdk/js } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, registry-url: "https://registry.npmjs.org" }
      - run: npm test
      - if: env.NODE_AUTH_TOKEN != ''
        run: |
          v=$(node -p 'require("./package.json").version')
          if npm view "@muthuishere/carry@$v" version >/dev/null 2>&1; then
            echo "already published"; exit 0; fi
          npm publish --access public

  pypi:
    runs-on: ubuntu-latest
    if: vars.PYPI_TRUSTED == 'true'
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - working-directory: sdk/python
        run: |
          python -m unittest discover -s tests
          python -m pip install build
          python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist
          skip-existing: true

  nuget:
    runs-on: ubuntu-latest
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
    defaults: { run: { working-directory: sdk/dotnet } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - run: dotnet test
      - if: env.NUGET_API_KEY != ''
        run: |
          dotnet pack src/Carry.Sdk -c Release -o out
          dotnet nuget push "out/*.nupkg" --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate

  maven:
    runs-on: ubuntu-latest
    env:
      CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
      CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
      SIGNING_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      SIGNING_PASSWORD: ${{ secrets.GPG_PASSPHRASE }}
    defaults: { run: { working-directory: sdk/java } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle test
      - if: env.CENTRAL_USERNAME != '' && env.SIGNING_KEY != ''
        run: |
          v=$(grep -m1 "^version" build.gradle | cut -d"'" -f2)
          if curl -sf "https://repo1.maven.org/maven2/io/github/muthuishere/carry-sdk/$v/carry-sdk-$v.pom" >/dev/null; then
            echo "already on Maven Central"; exit 0; fi
          gradle publishMavenPublicationToStagingRepository
          cd build/staging-deploy
          find . \( -name '*.asc.*' -o -name 'maven-metadata*' \) -delete
          zip -qr ../central-bundle.zip .
          token=$(printf %s "$CENTRAL_USERNAME:$CENTRAL_PASSWORD" | base64 -w0)
          curl -sf -H "Authorization: Bearer $token" -F bundle=@../central-bundle.zip \
            "https://central.sonatype.com/api/v1/publisher/upload?name=carry-sdk-$v&publishingType=AUTOMATIC"

  go:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - working-directory: sdk/go
        run: go test ./...
      - run: |
          tag="sdk/go/${GITHUB_REF_NAME}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag exists"
          else
            git tag "$tag" "$GITHUB_SHA" && git push origin "$tag"
          fi
          curl -sf "https://proxy.golang.org/github.com/muthuishere/carry/sdk/go/@v/${GITHUB_REF_NAME}.info"
